name: wings image

# Builds the wings-api gateway image into GitHub Container Registry.
# Upstream's docker-build.yml pushes to the upstream Docker Hub account and is
# disabled on this fork; this workflow is the fork's own image pipeline.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/wings-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: wings-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build wings-api image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          printf '%s\n' "$version" > VERSION
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "building version $version"

      - name: Build image for smoke test
        if: github.event_name == 'pull_request'
        run: docker build --tag wings-api:ci .

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name wings-smoke -p 127.0.0.1:3999:3000 wings-api:ci
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3999/api/status > /tmp/status.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          docker logs wings-smoke || true
          test "$ready" = 1
          cat /tmp/status.json

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wings1848/wings-api:${{ steps.version.outputs.value }}
            ghcr.io/wings1848/wings-api:sha-${{ github.sha }}

      - name: Point latest at the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/wings1848/wings-api:latest \
            "ghcr.io/wings1848/wings-api:${VERSION_TAG}"
        env:
          VERSION_TAG: ${{ steps.version.outputs.value }}
